name: frontend
description: "EEG Analysis Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0-323.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # File Picker
  file_picker: ^6.1.1
  
  # Charts
  fl_chart: ^0.65.0
  syncfusion_flutter_charts: ^24.1.41
  
  # UI
  flutter_svg: ^2.0.9
  
  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
